# Replaces /etc/nginx/nginx.conf on the VPS: one worker and a handful of
# connections, sized for a single user. Idle RSS is a few MB.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15;
    server_tokens off;
    access_log off;

    # Static files only: no request bodies, no proxying.
    client_max_body_size 1k;
    open_file_cache max=200 inactive=60s;

    include /etc/nginx/sites-enabled/*;
}
